<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>
  <style>
    .tit{font-size:15px;font-weight:600;fill:#1a202c}
    .sub{font-size:12px;fill:#4a5568}
    .lbl{font-size:12.5px;fill:#2d3748;font-weight:600}
    .cnt{font-size:11px;fill:#22543d}
    .val{font-size:12px;fill:#2d3748}
    .chip{fill:#ffffff;stroke:#2c7a7b}
    .ctxt{font-size:11px;fill:#22543d}
  </style>

  <text x="20" y="28" class="tit">install anatomy — AnvilNext PC (2015)</text>
  <text x="860" y="28" class="sub" text-anchor="end">bar length = GB on disk (linear scale)</text>

  <!-- bars: 20 px per GB, origin x=210 -->
  <g>
    <text x="20" y="86" class="lbl">root .forge</text><text x="20" y="102" class="cnt">24 containers</text>
    <rect x="210" y="70" width="580" height="26" rx="4" fill="#2c7a7b"/>
    <text x="800" y="88" class="val">29.0 GB</text>

    <text x="20" y="130" class="lbl">dlc_21</text><text x="20" y="146" class="cnt">Jack the Ripper · 28 files</text>
    <rect x="210" y="114" width="318" height="26" rx="4" fill="#38a89d"/>
    <text x="538" y="132" class="val">15.92 GB</text>

    <text x="20" y="174" class="lbl">sounddata/PC</text><text x="20" y="190" class="cnt">53 Wwise .pck (AKPK)</text>
    <rect x="210" y="158" width="140" height="26" rx="4" fill="#38a89d"/>
    <text x="360" y="176" class="val">7.00 GB</text>

    <text x="20" y="218" class="lbl">dlc_20</text><text x="20" y="234" class="cnt">Dreadful Crimes · 13 files</text>
    <rect x="210" y="202" width="91" height="26" rx="4" fill="#7fc8bf"/>
    <text x="311" y="220" class="val">4.55 GB</text>

    <text x="20" y="262" class="lbl">videos</text><text x="20" y="278" class="cnt">133 Bink-2 .bk2 (KB2i)</text>
    <rect x="210" y="246" width="90" height="26" rx="4" fill="#7fc8bf"/>
    <text x="310" y="264" class="val">4.20 GiB</text>

    <text x="20" y="306" class="lbl">dlc_11–14</text><text x="20" y="322" class="cnt">1 forge each</text>
    <rect x="210" y="290" width="84" height="26" rx="4" fill="#7fc8bf"/>
    <text x="304" y="308" class="val">4.19 GB</text>
  </g>

  <!-- config + middleware band -->
  <text x="20" y="360" class="sub" font-weight="600">ROOT CONFIG TRIO</text>
  <g>
    <rect x="20" y="370" width="150" height="20" rx="10" class="chip"/><text x="30" y="384" class="ctxt">ACS.exe.manifest (640 B)</text>
    <rect x="178" y="370" width="160" height="20" rx="10" class="chip"/><text x="188" y="384" class="ctxt">DefaultBindings.map (INI)</text>
    <rect x="346" y="370" width="180" height="20" rx="10" class="chip"/><text x="356" y="384" class="ctxt">localization.lang (19 B!)</text>
  </g>

  <text x="20" y="424" class="sub" font-weight="600">MIDDLEWARE DLLs AT THE ROOT (7 — all behind the packer's import wall)</text>
  <g>
    <rect x="20" y="434" width="80" height="20" rx="10" class="chip"/><text x="30" y="448" class="ctxt">bink2w64</text>
    <rect x="108" y="434" width="130" height="20" rx="10" class="chip"/><text x="118" y="448" class="ctxt">GFSDK_ShadowLib</text>
    <rect x="246" y="434" width="130" height="20" rx="10" class="chip"/><text x="256" y="448" class="ctxt">GFSDK_SSAO_D3D11</text>
    <rect x="384" y="434" width="90" height="20" rx="10" class="chip"/><text x="394" y="448" class="ctxt">GFSDK_TXAA</text>
    <rect x="482" y="434" width="70" height="20" rx="10" class="chip"/><text x="492" y="448" class="ctxt">NvGsa</text>
    <rect x="560" y="434" width="100" height="20" rx="10" class="chip"/><text x="570" y="448" class="ctxt">Tobii EyeX</text>
    <rect x="668" y="434" width="90" height="20" rx="10" class="chip"/><text x="678" y="448" class="ctxt">sqlitefs64</text>
  </g>
  <text x="20" y="486" class="sub">sqlitefs64 loads dynamically (LoadLibrary) — the one middleware absent from the static IAT.</text>
  <text x="20" y="510" class="sub">sizes/counts measured on-disk · no game content reproduced · spec: docs/install-layout.md</text>
</svg>
