<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <style>
    .tit{font-size:15px;font-weight:600;fill:#1a202c}
    .sub{font-size:12px;fill:#4a5568}
    .lbl{font-size:12.5px;fill:#2d3748;font-weight:600}
    .body{font-size:11.5px;fill:#4a5568}
    .grp{fill:#edf2f7;stroke:#4a5568;stroke-width:1.2}
    .hot{fill:#fefcbf;stroke:#b7791f}
  </style>

  <text x="20" y="28" class="tit">the import wall — a packer-rebuilt IAT</text>
  <text x="860" y="28" class="sub" text-anchor="end">31 DLLs · 33 functions total</text>

  <!-- ACS.exe -->
  <rect x="30" y="110" width="170" height="120" rx="8" fill="#1a202c"/>
  <text x="115" y="150" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">ACS.exe</text>
  <text x="115" y="172" fill="#cbd5e0" font-size="11" text-anchor="middle">packed (.UBX2 body)</text>
  <text x="115" y="190" fill="#cbd5e0" font-size="11" text-anchor="middle">9 virtual sections,</text>
  <text x="115" y="206" fill="#cbd5e0" font-size="11" text-anchor="middle">raw size 0</text>

  <!-- wall -->
  <rect x="280" y="110" width="190" height="120" rx="8" class="hot"/>
  <text x="375" y="145" class="lbl" text-anchor="middle">IAT WALL</text>
  <text x="375" y="166" class="body" text-anchor="middle">rebuilt by the packer:</text>
  <text x="375" y="183" class="body" text-anchor="middle">one function per DLL</text>
  <text x="375" y="200" class="body" text-anchor="middle">(KERNEL32 ×3)</text>
  <text x="375" y="217" class="sub" text-anchor="middle">→ iat-analysis.md</text>

  <!-- bus -->
  <line x1="200" y1="170" x2="280" y2="170" stroke="#4a5568" marker-end="url(#arr2)"/>
  <line x1="470" y1="170" x2="510" y2="170" stroke="#4a5568"/>
  <line x1="510" y1="70" x2="510" y2="310" stroke="#4a5568"/>

  <!-- groups -->
  <rect x="540" y="50" width="320" height="52" rx="6" class="grp"/>
  <text x="552" y="70" class="lbl">Graphics (5)</text>
  <text x="552" y="88" class="body">d3d11 · dxgi · d3d9 · D3DCOMPILER_43 · OPENGL32</text>
  <line x1="510" y1="76" x2="535" y2="76" stroke="#4a5568" marker-end="url(#arr2)"/>

  <rect x="540" y="112" width="320" height="52" rx="6" class="grp"/>
  <text x="552" y="132" class="lbl">Input (3)</text>
  <text x="552" y="150" class="body">DINPUT8 · XINPUT9_1_0 · HID</text>
  <line x1="510" y1="138" x2="535" y2="138" stroke="#4a5568" marker-end="url(#arr2)"/>

  <rect x="540" y="174" width="320" height="52" rx="6" class="grp"/>
  <text x="552" y="194" class="lbl">Middleware, by name (7)</text>
  <text x="552" y="212" class="body">uplay loader · bink2 · GFSDK ×3 · NvGsa · Tobii</text>
  <line x1="510" y1="200" x2="535" y2="200" stroke="#4a5568" marker-end="url(#arr2)"/>

  <rect x="540" y="236" width="320" height="52" rx="6" class="grp"/>
  <text x="552" y="256" class="lbl">System (16)</text>
  <text x="552" y="274" class="body">KERNEL32(×3) · USER32 · GDI32 · CRYPT32 · bcrypt · …</text>
  <line x1="510" y1="262" x2="535" y2="262" stroke="#4a5568" marker-end="url(#arr2)"/>

  <rect x="540" y="298" width="320" height="52" rx="6" fill="#e6fffa" stroke="#2c7a7b"/>
  <text x="552" y="318" class="lbl">Behind the wall at runtime</text>
  <text x="552" y="336" class="body">sqlitefs64 — LoadLibrary'd, never in the static IAT</text>
  <line x1="510" y1="310" x2="535" y2="324" stroke="#2c7a7b" stroke-dasharray="4 3"/>

  <!-- takeaway -->
  <text x="30" y="280" class="sub" font-weight="600">Why it matters:</text>
  <text x="30" y="300" class="sub">the IAT is not a dependency list — it is the</text>
  <text x="30" y="318" class="sub">packer's forwarding surface. Middleware is</text>
  <text x="30" y="336" class="sub">reachable by name only through it.</text>
  <text x="30" y="376" class="sub">facts: docs/exe-surface.md · analysis: docs/iat-analysis.md</text>
</svg>
